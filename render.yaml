services:
  - type: web
    name: cloudy-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Set Auto-Deploy to "After CI checks pass" in the dashboard.
    autoDeploy: true
    envVars:
      - key: API_KEY
        sync: false
      - key: SIGNING_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUE
        value: "20"
      - key: MAX_BATCH
        value: "10"
      - key: MAX_DURATION_SECONDS
        value: "1800"
      - key: FILE_TTL_MINUTES
        value: "30"
      - key: SIGNED_URL_TTL_SECONDS
        value: "600"
      # deno is preferred, node is the fallback (both are in the image).
      - key: YTDLP_JS_RUNTIMES
        value: deno,node
      # Optional escape hatches for YouTube bot checks:
      # - add a Secret File named cookies.txt, then set
      #   YTDLP_COOKIES_FILE=/etc/secrets/cookies.txt
      # - YTDLP_PROXY=http://user:pass@host:port
      # - YTDLP_EXTRACTOR_ARGS=youtube:player_client=default,mweb
